name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate add-on metadata and Python 3.8 compatibility
        run: python tools/package.py --output "$RUNNER_TEMP/dhakaflix-validation.zip"

  package:
    name: Build installable Kodi ZIP
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build ZIP and SHA-256 checksum
        run: python tools/package.py

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: dhakaflix-kodi-addon
          path: |
            dist/plugin.bdix.dhakaflix-*.zip
            dist/plugin.bdix.dhakaflix-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish private GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build release ZIP and checksum
        run: python tools/package.py

      - name: Verify tag matches add-on version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("plugin.bdix.dhakaflix/addon.xml").getroot().attrib["version"])')"
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ZIP="dist/plugin.bdix.dhakaflix-${VERSION}.zip"
          gh release create "$RELEASE_TAG" "$ZIP" "$ZIP.sha256" --generate-notes --verify-tag
