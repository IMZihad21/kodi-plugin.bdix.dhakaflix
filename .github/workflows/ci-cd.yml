name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Lint Python
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .

      - name: Check Python formatting
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate add-on metadata and Kodi Python compatibility
        if: matrix.python-version == '3.11'
        run: python tools/package.py --output "${{ runner.temp }}/dhakaflix-validation.zip"

  package:
    name: Build installable Kodi ZIP
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Build ZIP and SHA-256 checksum
        run: python tools/package.py

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: dhakaflix-kodi-addon
          path: |
            dist/plugin.bdix.dhakaflix-*.zip
            dist/plugin.bdix.dhakaflix-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish private GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Download validated package
        uses: actions/download-artifact@v8
        with:
          name: dhakaflix-kodi-addon
          path: dist

      - name: Verify tag matches add-on version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("plugin.bdix.dhakaflix/addon.xml").getroot().attrib["version"])')"
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ZIP="dist/plugin.bdix.dhakaflix-${VERSION}.zip"
          gh release create "$RELEASE_TAG" "$ZIP" "$ZIP.sha256" --generate-notes --verify-tag
